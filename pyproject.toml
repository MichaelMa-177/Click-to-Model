[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "click-to-model"
version = "0.2.0"
description = "Interactive RGB-D object reconstruction and real-time 6D tracking"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Mingwei Ma"}]
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "open3d>=0.18",
  "scipy>=1.10",
  "trimesh>=4.0",
]

[project.scripts]
click-to-model = "click_to_model.pipeline:main"
click-to-model-reconstruct = "click_to_model.reconstruction.cli:main"

[project.optional-dependencies]
camera = ["pyrealsense2>=2.55"]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["click_to_model*"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
